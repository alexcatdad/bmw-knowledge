name: Normalize corpus

on:
  workflow_call:
    inputs:
      processor_revision:
        type: string
        required: true
      callback_url:
        type: string
        required: true
    secrets:
      processing_callback_secret:
        required: true

permissions:
  contents: write

concurrency:
  group: normalize-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate pinned processor
        env:
          PROCESSOR_REVISION: ${{ inputs.processor_revision }}
        run: '[[ "$PROCESSOR_REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: corpus
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alexcatdad/bmw-knowledge
          ref: ${{ inputs.processor_revision }}
          path: tooling
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: tooling/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tooling/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: tooling
      - name: Normalize captured inputs
        id: normalize
        continue-on-error: true
        working-directory: tooling
        env:
          PROCESSOR_REVISION: ${{ inputs.processor_revision }}
        run: |
          INPUT_REVISION=$(git -C "$GITHUB_WORKSPACE/corpus" rev-parse HEAD)
          pnpm normalize --corpus "$GITHUB_WORKSPACE/corpus" --all \
            --processor-revision "$PROCESSOR_REVISION" --input-revision "$INPUT_REVISION" \
            --summary "$RUNNER_TEMP/normalization-summary.json"
      - name: Commit derived outputs
        working-directory: corpus
        env:
          CORPUS_BRANCH: ${{ github.ref_name }}
        run: |
          test -f "$RUNNER_TEMP/normalization-summary.json"
          git config user.name 'bmw-corpus processor'
          git config user.email 'bmw-corpus-processor@users.noreply.github.com'
          for directory in normalized processing; do
            if test -d "$directory"; then
              git add -- "$directory"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize captured source material'
            for attempt in 1 2 3; do
              printf 'Publication attempt %s of 3\n' "$attempt"
              if git push origin "HEAD:refs/heads/$CORPUS_BRANCH"; then
                exit 0
              fi
              git fetch origin "$CORPUS_BRANCH"
              git rebase "origin/$CORPUS_BRANCH"
            done
            exit 1
          fi
      - name: Prove and report immutable outputs
        working-directory: tooling
        env:
          PROCESSING_CALLBACK_URL: ${{ inputs.callback_url }}
          PROCESSING_CALLBACK_SECRET: ${{ secrets.processing_callback_secret }}
          CORPUS_GITHUB_OWNER: ${{ github.repository_owner }}
          CORPUS_GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          RESULT_REVISION=$(git -C "$GITHUB_WORKSPACE/corpus" rev-parse HEAD)
          pnpm normalization-report --corpus "$GITHUB_WORKSPACE/corpus" \
            --summary "$RUNNER_TEMP/normalization-summary.json" --result-revision "$RESULT_REVISION"
      - name: Keep processor failures visible
        if: steps.normalize.outcome == 'failure'
        run: exit 1
